<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>The Raspberry Pi "brain" on the bench</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38505e"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3559a8"/></marker>
</defs>
<rect width="1040" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1d2a33">The Raspberry Pi "brain" on the bench</text>
<rect x="40" y="80" width="230" height="110" rx="10" fill="#fdecd8" stroke="#b8670f" stroke-width="2"/><text x="52" y="104" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">12 V bench power supply</text><text x="52" y="124" font-size="12.5" fill="#5b6b75" text-anchor="start">12 V, 5 A, current limit set</text><text x="52" y="141" font-size="12.5" fill="#5b6b75" text-anchor="start">to about 3 A while testing</text>
<rect x="40" y="230" width="230" height="110" rx="10" fill="#fdecd8" stroke="#b8670f" stroke-width="2"/><text x="52" y="254" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Ignition switch (test)</text><text x="52" y="274" font-size="12.5" fill="#5b6b75" text-anchor="start">any on/off toggle switch</text><text x="52" y="291" font-size="12.5" fill="#5b6b75" text-anchor="start">stands in for the truck key</text><text x="52" y="308" font-size="12.5" fill="#5b6b75" text-anchor="start">on = "truck on"</text>
<rect x="360" y="120" width="300" height="230" rx="10" fill="#dcecf2" stroke="#1c6b80" stroke-width="2"/><text x="372" y="144" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Raspberry Pi 5 + CarPiHAT PRO 5</text><text x="372" y="164" font-size="12.5" fill="#5b6b75" text-anchor="start">Active Cooler on the Pi first,</text><text x="372" y="181" font-size="12.5" fill="#5b6b75" text-anchor="start">then the HAT on the 40-pin header</text><text x="372" y="198" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="372" y="215" font-size="12.5" fill="#5b6b75" text-anchor="start">HAT terminals:</text><text x="372" y="232" font-size="12.5" fill="#5b6b75" text-anchor="start">  12V constant  ← supply +</text><text x="372" y="249" font-size="12.5" fill="#5b6b75" text-anchor="start">  12V ignition  ← switch</text><text x="372" y="266" font-size="12.5" fill="#5b6b75" text-anchor="start">  GND           ← supply −</text><text x="372" y="283" font-size="12.5" fill="#5b6b75" text-anchor="start">microSD: Raspberry Pi OS 64-bit</text>
<rect x="760" y="70" width="240" height="70" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="772" y="94" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">USB SSD</text><text x="772" y="114" font-size="12.5" fill="#5b6b75" text-anchor="start">blue USB 3 port</text>
<rect x="760" y="160" width="240" height="70" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="772" y="184" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">USB GPS puck</text><text x="772" y="204" font-size="12.5" fill="#5b6b75" text-anchor="start">optional on the bench</text>
<rect x="760" y="250" width="240" height="70" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="772" y="274" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">USB Wi-Fi adapter</text><text x="772" y="294" font-size="12.5" fill="#5b6b75" text-anchor="start">becomes wlan1 (internet)</text>
<rect x="760" y="340" width="240" height="70" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2" stroke-dasharray="6 5"/><text x="772" y="364" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Powered USB hub</text><text x="772" y="384" font-size="12.5" fill="#5b6b75" text-anchor="start">for the camera sticks later</text>
<rect x="360" y="430" width="300" height="90" rx="10" fill="#e0f2e7" stroke="#2e7d4f" stroke-width="2"/><text x="372" y="454" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Built-in Wi-Fi = access point</text><text x="372" y="474" font-size="12.5" fill="#5b6b75" text-anchor="start">network name: slate-truck</text><text x="372" y="491" font-size="12.5" fill="#5b6b75" text-anchor="start">address: 10.42.0.1, port 8080</text>
<rect x="760" y="450" width="240" height="80" rx="10" fill="#e6eefc" stroke="#3559a8" stroke-width="2"/><text x="772" y="474" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Dash tablet</text><text x="772" y="494" font-size="12.5" fill="#5b6b75" text-anchor="start">joins slate-truck</text><text x="772" y="511" font-size="12.5" fill="#5b6b75" text-anchor="start">opens http://10.42.0.1:8080</text>
<rect x="40" y="450" width="230" height="80" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="52" y="474" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Truck box (ESP32)</text><text x="52" y="494" font-size="12.5" fill="#5b6b75" text-anchor="start">joins slate-truck too</text><text x="52" y="511" font-size="12.5" fill="#5b6b75" text-anchor="start">(Part 5)</text>
<polyline points="270,125 360,170" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/><text x="280" y="128" font-size="12.5" fill="#c0392b" font-weight="600">+12 V / GND</text>
<polyline points="270,285 360,250" fill="none" stroke="#b8670f" stroke-width="2.2" marker-end="url(#a)"/><text x="278" y="300" font-size="12.5" fill="#b8670f" font-weight="600">switched 12 V</text>
<polyline points="660,150 760,105" fill="none" stroke="#38505e" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="660,190 760,195" fill="none" stroke="#38505e" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="660,240 760,285" fill="none" stroke="#38505e" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="660,300 760,375" fill="none" stroke="#38505e" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<polyline points="510,350 510,430" fill="none" stroke="#38505e" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="660,475 760,490" fill="none" stroke="#2e7d4f" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#a)" marker-start="url(#a)"/><text x="690" y="470" font-size="12.5" fill="#2e7d4f" font-weight="600">Wi-Fi</text>
<polyline points="360,475 270,490" fill="none" stroke="#2e7d4f" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#a)" marker-start="url(#a)"/><text x="295" y="470" font-size="12.5" fill="#2e7d4f" font-weight="600">Wi-Fi</text>
<text x="40" y="590" font-size="13" fill="#c0392b" font-weight="600" text-anchor="start">Never feed the Pi from its own USB-C port and the HAT at the same time. On the bench and in the truck, power comes only through the HAT.</text>
</svg>