<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>Where everything goes (top view of the cab, not to scale)</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38505e"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3559a8"/></marker>
</defs>
<rect width="1400" height="720" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1d2a33">Where everything goes (top view of the cab, not to scale)</text>
<rect x="140" y="70" width="760" height="560" rx="60" fill="#f3f6f8" stroke="#78909c" stroke-width="3"/>
<path d="M140 190 L900 190" stroke="#78909c" stroke-width="2" stroke-dasharray="4 6"/>
<text x="520" y="100" font-size="13" fill="#5b6b75" font-weight="700" text-anchor="middle">FRONT OF TRUCK (windshield)</text>
<text x="520" y="622" font-size="13" fill="#5b6b75" font-weight="700" text-anchor="middle">BACK OF CAB → bed</text>
<rect x="170" y="120" width="700" height="70" rx="14" fill="#dfe5e9" stroke="#78909c" stroke-width="2"/>
<text x="185" y="140" font-size="13" fill="#5b6b75" font-weight="400" text-anchor="start">dash</text>
<rect x="230" y="300" width="200" height="230" rx="30" fill="#e7ebee" stroke="#78909c" stroke-width="2"/>
<text x="330" y="420" font-size="13" fill="#5b6b75" font-weight="400" text-anchor="middle">driver seat</text>
<rect x="610" y="300" width="200" height="230" rx="30" fill="#e7ebee" stroke="#78909c" stroke-width="2"/>
<text x="710" y="420" font-size="13" fill="#5b6b75" font-weight="400" text-anchor="middle">passenger seat</text>
<rect x="460" y="128" width="120" height="50" rx="8" fill="#e6eefc" stroke="#3559a8" stroke-width="2.5"/>
<circle cx="445" cy="153" r="13" fill="#3559a8"/><text x="445" y="158" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<rect x="640" y="200" width="150" height="60" rx="8" fill="#dcecf2" stroke="#1c6b80" stroke-width="2.5"/>
<circle cx="625" cy="230" r="13" fill="#1c6b80"/><text x="625" y="235" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<circle cx="770" cy="135" r="13" fill="#e0f2e7" stroke="#2e7d4f" stroke-width="2.5"/>
<circle cx="800" cy="135" r="13" fill="#2e7d4f"/><text x="800" y="140" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<rect x="630" y="440" width="120" height="60" rx="8" fill="#efe6f8" stroke="#6a3d9a" stroke-width="2.5"/>
<circle cx="615" cy="470" r="13" fill="#6a3d9a"/><text x="615" y="475" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<rect x="300" y="200" width="110" height="50" rx="8" fill="#fdecd8" stroke="#b8670f" stroke-width="2.5"/>
<circle cx="285" cy="225" r="13" fill="#b8670f"/><text x="285" y="230" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<rect x="500" y="200" width="80" height="45" rx="8" fill="#efe6f8" stroke="#6a3d9a" stroke-width="2.5"/>
<circle cx="485" cy="222" r="13" fill="#6a3d9a"/><text x="485" y="227" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<circle cx="520" cy="52" r="12" fill="#fbe3e0" stroke="#c0392b" stroke-width="2.5"/>
<text x="540" y="57" font-size="12" fill="#c0392b" font-weight="600" text-anchor="start">front camera (grille)</text>
<circle cx="520" cy="672" r="12" fill="#fbe3e0" stroke="#c0392b" stroke-width="2.5"/>
<text x="540" y="668" font-size="12" fill="#c0392b" font-weight="600" text-anchor="start">bed camera (cab back, looking into the bed)</text>
<text x="540" y="690" font-size="12" fill="#c0392b" font-weight="400" text-anchor="start">rear (tailgate) + hitch cameras are further back, on the bed</text>
<circle cx="960" cy="120" r="13" fill="#3559a8"/><text x="960" y="125" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="985" y="116" font-size="14" fill="#1d2a33" font-weight="700" text-anchor="start">Tablet in Slate's Tablet Mount</text><text x="985" y="136" font-size="12.5" fill="#5b6b75" font-weight="400" text-anchor="start">charger in the dash 12 V socket; hub + Carlinkit behind it</text>
<circle cx="960" cy="200" r="13" fill="#1c6b80"/><text x="960" y="205" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="985" y="196" font-size="14" fill="#1d2a33" font-weight="700" text-anchor="start">Brain enclosure (Pi + CarPiHAT + SSD)</text><text x="985" y="216" font-size="12.5" fill="#5b6b75" font-weight="400" text-anchor="start">under the dash, out of the sun, vents clear</text>
<circle cx="960" cy="280" r="13" fill="#2e7d4f"/><text x="960" y="285" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="985" y="276" font-size="14" fill="#1d2a33" font-weight="700" text-anchor="start">GPS puck</text><text x="985" y="296" font-size="12.5" fill="#5b6b75" font-weight="400" text-anchor="start">top of the dash, under the glass, clear view of sky</text>
<circle cx="960" cy="360" r="13" fill="#6a3d9a"/><text x="960" y="365" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="985" y="356" font-size="14" fill="#1d2a33" font-weight="700" text-anchor="start">Truck box (ESP32)</text><text x="985" y="376" font-size="12.5" fill="#5b6b75" font-weight="400" text-anchor="start">under a seat: lowest, coolest, out of sight</text>
<circle cx="960" cy="440" r="13" fill="#b8670f"/><text x="960" y="445" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="985" y="436" font-size="14" fill="#1d2a33" font-weight="700" text-anchor="start">Fuse block + taps</text><text x="985" y="456" font-size="12.5" fill="#5b6b75" font-weight="400" text-anchor="start">near the truck's fuse box (location TBD)</text>
<circle cx="960" cy="520" r="13" fill="#6a3d9a"/><text x="960" y="525" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="985" y="516" font-size="14" fill="#1d2a33" font-weight="700" text-anchor="start">Service point (Deutsch plugs)</text><text x="985" y="536" font-size="12.5" fill="#5b6b75" font-weight="400" text-anchor="start">every run meets here, so each part unplugs</text>
</svg>