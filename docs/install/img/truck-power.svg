<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 710" width="1100" height="710" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>Truck power: one fused feed per thing</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38505e"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3559a8"/></marker>
</defs>
<rect width="1100" height="710" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1d2a33">Truck power: one fused feed per thing</text>
<rect x="40" y="90" width="200" height="90" rx="10" fill="#fdecd8" stroke="#b8670f" stroke-width="2"/><text x="52" y="114" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">12 V battery</text><text x="52" y="134" font-size="12.5" fill="#5b6b75" text-anchor="start">(NOT the big orange</text><text x="52" y="151" font-size="12.5" fill="#5b6b75" text-anchor="start">high-voltage pack)</text>
<rect x="40" y="270" width="200" height="100" rx="10" fill="#fdecd8" stroke="#b8670f" stroke-width="2"/><text x="52" y="294" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Truck fuse box</text><text x="52" y="314" font-size="12.5" fill="#5b6b75" text-anchor="start">add-a-circuit taps here</text><text x="52" y="331" font-size="12.5" fill="#5b6b75" text-anchor="start">one CONSTANT, one</text><text x="52" y="348" font-size="12.5" fill="#5b6b75" text-anchor="start">IGNITION (switched)</text>
<rect x="290" y="126" width="34" height="18" rx="4" fill="#fff6cc" stroke="#b8670f" stroke-width="2"/><text x="307" y="121" font-size="12" font-weight="700" fill="#b8670f" text-anchor="middle">30 A</text>
<polyline points="240,135 290,135" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<polyline points="324,135 380,135" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<rect x="390" y="80" width="210" height="420" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="402" y="104" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">6-way fuse block</text><text x="402" y="124" font-size="12.5" fill="#5b6b75" text-anchor="start">fed straight from the battery</text><text x="402" y="141" font-size="12.5" fill="#5b6b75" text-anchor="start">with a negative (ground) bus</text><text x="402" y="158" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="175" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="192" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="209" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="226" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="243" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="260" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="277" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="294" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="311" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="328" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="345" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="362" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="379" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="396" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="413" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="430" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="447" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="464" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="402" y="481" font-size="12.5" fill="#5b6b75" text-anchor="start">ground bus → one solid chassis</text><text x="402" y="498" font-size="12.5" fill="#5b6b75" text-anchor="start">ground bolt (bare metal)</text>
<polyline points="600,140 650,140" fill="none" stroke="#c0392b" stroke-width="2.2"/><rect x="650" y="131" width="34" height="18" rx="4" fill="#fff6cc" stroke="#b8670f" stroke-width="2"/><text x="667" y="126" font-size="12" font-weight="700" fill="#b8670f" text-anchor="middle">5 A</text><polyline points="684,140 720,140" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/><rect x="720" y="110" width="340" height="60" rx="10" fill="#fff" stroke="#78909c" stroke-width="2"/><text x="732" y="134" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">CarPiHAT 12V constant</text><text x="732" y="154" font-size="12.5" fill="#5b6b75" text-anchor="start">keeps the Pi up for a clean shutdown</text>
<polyline points="600,210 650,210" fill="none" stroke="#c0392b" stroke-width="2.2"/><rect x="650" y="201" width="34" height="18" rx="4" fill="#fff6cc" stroke="#b8670f" stroke-width="2"/><text x="667" y="196" font-size="12" font-weight="700" fill="#b8670f" text-anchor="middle">3 A</text><polyline points="684,210 720,210" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/><rect x="720" y="180" width="340" height="60" rx="10" fill="#fff" stroke="#78909c" stroke-width="2"/><text x="732" y="204" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Truck box (ESP32)</text><text x="732" y="224" font-size="12.5" fill="#5b6b75" text-anchor="start">through its own diode + buck</text>
<polyline points="600,280 650,280" fill="none" stroke="#c0392b" stroke-width="2.2"/><rect x="650" y="271" width="34" height="18" rx="4" fill="#fff6cc" stroke="#b8670f" stroke-width="2"/><text x="667" y="266" font-size="12" font-weight="700" fill="#b8670f" text-anchor="middle">5 A</text><polyline points="684,280 720,280" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/><rect x="720" y="250" width="340" height="60" rx="10" fill="#fff" stroke="#78909c" stroke-width="2"/><text x="732" y="274" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Powered USB hub (cameras)</text><text x="732" y="294" font-size="12.5" fill="#5b6b75" text-anchor="start">12 V-fed hub, or a 12→5 V buck</text>
<polyline points="600,350 650,350" fill="none" stroke="#c0392b" stroke-width="2.2"/><rect x="650" y="341" width="34" height="18" rx="4" fill="#fff6cc" stroke="#b8670f" stroke-width="2"/><text x="667" y="336" font-size="12" font-weight="700" fill="#b8670f" text-anchor="middle">5 A</text><polyline points="684,350 720,350" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/><rect x="720" y="320" width="340" height="60" rx="10" fill="#fff" stroke="#78909c" stroke-width="2"/><text x="732" y="344" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Cameras (AHD) power</text><text x="732" y="364" font-size="12.5" fill="#5b6b75" text-anchor="start">often a 12 V pigtail per camera</text>
<polyline points="600,420 650,420" fill="none" stroke="#c0392b" stroke-width="2.2"/><rect x="650" y="411" width="34" height="18" rx="4" fill="#fff6cc" stroke="#b8670f" stroke-width="2"/><text x="667" y="406" font-size="12" font-weight="700" fill="#b8670f" text-anchor="middle">10 A</text><polyline points="684,420 720,420" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/><rect x="720" y="390" width="340" height="60" rx="10" fill="#fff" stroke="#78909c" stroke-width="2"/><text x="732" y="414" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Spare / relay loads</text><text x="732" y="434" font-size="12.5" fill="#5b6b75" text-anchor="start">via the 40 A relays, not the board</text>
<polyline points="140,370 140,640 660,640 660,505 720,505" fill="none" stroke="#b8670f" stroke-width="2.2" marker-end="url(#a)"/><text x="160" y="630" font-size="12.5" fill="#b8670f" font-weight="600">IGNITION tap, 1 A fuse: the "truck is on" signal</text>
<rect x="720" y="470" width="340" height="70" rx="10" fill="#fff" stroke="#78909c" stroke-width="2"/><text x="732" y="494" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">CarPiHAT 12V ignition input</text><text x="732" y="514" font-size="12.5" fill="#5b6b75" text-anchor="start">and the truck box's ignition opto</text>
<rect x="720" y="545" width="340" height="80" rx="10" fill="#e6eefc" stroke="#3559a8" stroke-width="2"/><text x="732" y="569" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Dash 12 V socket (believed switched)</text><text x="732" y="589" font-size="12.5" fill="#5b6b75" text-anchor="start">tablet's 45 W USB-C car charger</text><text x="732" y="606" font-size="12.5" fill="#5b6b75" text-anchor="start">plugs in here: no tap needed</text>
<polyline points="140,180 140,270" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="40" y="685" font-size="13.5" fill="#c0392b" font-weight="600" text-anchor="start">Fuse each run at the SOURCE end, sized to the wire. Check constant vs switched with a meter before you tap anything (Step 2).</text>
</svg>