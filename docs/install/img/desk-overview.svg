<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>On the desk: what plugs into what</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38505e"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3559a8"/></marker>
</defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1d2a33">On the desk: what plugs into what</text>
<rect x="40" y="80" width="250" height="120" rx="10" fill="#dcecf2" stroke="#1c6b80" stroke-width="2"/><text x="52" y="104" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Your computer</text><text x="52" y="124" font-size="12.5" fill="#5b6b75" text-anchor="start">Windows, Mac or Linux with Node 24</text><text x="52" y="141" font-size="12.5" fill="#5b6b75" text-anchor="start">runs the "brain" with SIM=1</text><text x="52" y="158" font-size="12.5" fill="#5b6b75" text-anchor="start">(a simulated truck)</text>
<rect x="40" y="240" width="250" height="90" rx="10" fill="#dcecf2" stroke="#1c6b80" stroke-width="2" stroke-dasharray="6 5"/><text x="52" y="264" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">or: a home server / NAS</text><text x="52" y="284" font-size="12.5" fill="#5b6b75" text-anchor="start">runs the same brain in Docker</text><text x="52" y="301" font-size="12.5" fill="#5b6b75" text-anchor="start">(optional)</text>
<rect x="370" y="140" width="220" height="110" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="382" y="164" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Home Wi-Fi router</text><text x="382" y="184" font-size="12.5" fill="#5b6b75" text-anchor="start">the tablet and the brain</text><text x="382" y="201" font-size="12.5" fill="#5b6b75" text-anchor="start">must be on the same network</text>
<rect x="680" y="80" width="280" height="150" rx="10" fill="#e6eefc" stroke="#3559a8" stroke-width="2"/><text x="692" y="104" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Dash tablet</text><text x="692" y="124" font-size="12.5" fill="#5b6b75" text-anchor="start">Galaxy Tab S7 FE (or similar Android)</text><text x="692" y="141" font-size="12.5" fill="#5b6b75" text-anchor="start">Chrome, "Add to Home screen"</text><text x="692" y="158" font-size="12.5" fill="#5b6b75" text-anchor="start">opens http://&lt;brain address&gt;:&lt;port&gt;</text><text x="692" y="175" font-size="12.5" fill="#5b6b75" text-anchor="start">Tasker for wake / sleep</text>
<rect x="700" y="300" width="240" height="80" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="712" y="324" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">USB-C hub with PD pass-through</text><text x="712" y="344" font-size="12.5" fill="#5b6b75" text-anchor="start">power in + a USB-A data port</text>
<rect x="420" y="300" width="200" height="80" rx="10" fill="#fdecd8" stroke="#b8670f" stroke-width="2"/><text x="432" y="324" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">45 W USB-C wall charger</text><text x="432" y="344" font-size="12.5" fill="#5b6b75" text-anchor="start">plays the truck's 12 V</text>
<rect x="700" y="440" width="240" height="80" rx="10" fill="#efe6f8" stroke="#6a3d9a" stroke-width="2"/><text x="712" y="464" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Carlinkit CPC200-CCPA</text><text x="712" y="484" font-size="12.5" fill="#5b6b75" text-anchor="start">wireless CarPlay → USB</text>
<rect x="420" y="440" width="200" height="80" rx="10" fill="#efe6f8" stroke="#6a3d9a" stroke-width="2"/><text x="432" y="464" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">iPhone</text><text x="432" y="484" font-size="12.5" fill="#5b6b75" text-anchor="start">joins the Carlinkit</text><text x="432" y="501" font-size="12.5" fill="#5b6b75" text-anchor="start">by Bluetooth + Wi-Fi</text>
<polyline points="290,150 370,180" fill="none" stroke="#38505e" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#a)"/><text x="292" y="140" font-size="12.5" fill="#1d2a33" font-weight="600">Wi-Fi or cable</text>
<polyline points="290,280 370,230" fill="none" stroke="#38505e" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#a)" marker-start="url(#a)"/>
<polyline points="590,180 680,160" fill="none" stroke="#38505e" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#a)"/><text x="615" y="160" font-size="12.5" fill="#1d2a33" font-weight="600">Wi-Fi</text>
<polyline points="820,300 820,230" fill="none" stroke="#b8670f" stroke-width="2.2" marker-end="url(#a)"/><text x="830" y="270" font-size="12.5" fill="#b8670f" font-weight="600">USB-C (power + data)</text>
<polyline points="620,340 700,340" fill="none" stroke="#b8670f" stroke-width="2.2" marker-end="url(#a)"/><text x="640" y="330" font-size="12.5" fill="#b8670f" font-weight="600">USB-C</text>
<polyline points="820,440 820,380" fill="none" stroke="#38505e" stroke-width="2.2" marker-end="url(#a)"/><text x="830" y="415" font-size="12.5" fill="#1d2a33" font-weight="600">USB-A</text>
<polyline points="620,480 700,480" fill="none" stroke="#6a3d9a" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#a)" marker-start="url(#a)"/><text x="632" y="470" font-size="12.5" fill="#6a3d9a" font-weight="600">wireless</text>
<text x="40" y="400" font-size="14" fill="#5b6b75" font-weight="400" text-anchor="start">Part 1 needs only the computer.</text><text x="40" y="418" font-size="14" fill="#5b6b75" font-weight="400" text-anchor="start">Part 2 adds the tablet.</text><text x="40" y="436" font-size="14" fill="#5b6b75" font-weight="400" text-anchor="start">Part 3 adds the charger, hub,</text><text x="40" y="454" font-size="14" fill="#5b6b75" font-weight="400" text-anchor="start">dongle and iPhone (CarPlay).</text>
</svg>