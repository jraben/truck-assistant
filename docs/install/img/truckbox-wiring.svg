<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>Truck box wiring (sense only listens, relays only switch circuits you add)</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38505e"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3559a8"/></marker>
</defs>
<rect width="1120" height="760" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1d2a33">Truck box wiring (sense only listens, relays only switch circuits you add)</text>
<text x="40" y="80" font-size="16" fill="#b8670f" font-weight="700" text-anchor="start">A. Power</text>
<rect x="40" y="95" width="150" height="70" rx="10" fill="#fdecd8" stroke="#b8670f" stroke-width="2"/><text x="52" y="119" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">12 V battery +</text><text x="52" y="139" font-size="12.5" fill="#5b6b75" text-anchor="start">or fuse-block constant</text>
<rect x="220" y="121" width="34" height="18" rx="4" fill="#fff6cc" stroke="#b8670f" stroke-width="2"/><text x="237" y="116" font-size="12" font-weight="700" fill="#b8670f" text-anchor="middle">3 A</text>
<polyline points="190,130 220,130" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<polyline points="254,130 290,130" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<rect x="290" y="95" width="170" height="70" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="302" y="119" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Schottky diode</text><text x="302" y="139" font-size="12.5" fill="#5b6b75" text-anchor="start">SS54 / 1N5822</text><text x="302" y="156" font-size="12.5" fill="#5b6b75" text-anchor="start">stops reverse polarity</text>
<polyline points="460,130 520,130" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<rect x="520" y="95" width="190" height="70" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="532" y="119" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Pololu D36V28F5</text><text x="532" y="139" font-size="12.5" fill="#5b6b75" text-anchor="start">12 V → clean 5 V</text>
<polyline points="710,130 790,130" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<polyline points="790,130 800,130" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="800" y="95" width="280" height="70" rx="10" fill="#dcecf2" stroke="#1c6b80" stroke-width="2"/><text x="812" y="119" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Relay board: 5V + GND terminals</text><text x="812" y="139" font-size="12.5" fill="#5b6b75" text-anchor="start">NOT the board's 7–30 V input</text>
<rect x="470" y="185" width="140" height="50" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="482" y="209" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">SMBJ24A TVS</text><text x="482" y="229" font-size="12.5" fill="#5b6b75" text-anchor="start">+ side to GND</text>
<polyline points="490,130 490,185" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<text x="40" y="260" font-size="13" fill="#5b6b75" font-weight="400" text-anchor="start">All grounds (battery −, buck GND, board GND, opto GND) meet at one point.</text>
<text x="40" y="310" font-size="16" fill="#2e7d4f" font-weight="700" text-anchor="start">B. Sense inputs (Five Switch ×5, ignition, reverse)</text>
<rect x="40" y="325" width="190" height="80" rx="10" fill="#fdecd8" stroke="#b8670f" stroke-width="2"/><text x="52" y="349" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Truck 12 V wire</text><text x="52" y="369" font-size="12.5" fill="#5b6b75" text-anchor="start">e.g. ignition feed</text><text x="52" y="386" font-size="12.5" fill="#5b6b75" text-anchor="start">via an add-a-circuit tap</text>
<rect x="255" y="356" width="34" height="18" rx="4" fill="#fff6cc" stroke="#b8670f" stroke-width="2"/><text x="272" y="351" font-size="12" font-weight="700" fill="#b8670f" text-anchor="middle">1 A</text>
<polyline points="230,365 255,365" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<polyline points="289,365 330,365" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<rect x="330" y="318" width="260" height="168" rx="10" fill="#e0f2e7" stroke="#2e7d4f" stroke-width="2"/><text x="342" y="342" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">PC817 opto module</text><text x="342" y="362" font-size="12.5" fill="#5b6b75" text-anchor="start">INPUT side (12 V):</text><text x="342" y="379" font-size="12.5" fill="#5b6b75" text-anchor="start">   IN+ ← the fused 12 V wire</text><text x="342" y="396" font-size="12.5" fill="#5b6b75" text-anchor="start">   IN− ← truck ground</text><text x="342" y="413" font-size="12.5" fill="#5b6b75" text-anchor="start">OUTPUT side (3.3 V):</text><text x="342" y="430" font-size="12.5" fill="#5b6b75" text-anchor="start">   VCC → ESP 3V3,  GND → ESP GND</text><text x="342" y="447" font-size="12.5" fill="#5b6b75" text-anchor="start">   OUT → GPIO pin</text><text x="342" y="464" font-size="12.5" fill="#5b6b75" text-anchor="start">input resistor must suit 12 V (~3 kΩ)</text>
<polyline points="590,400 800,400" fill="none" stroke="#2e7d4f" stroke-width="2.2" marker-end="url(#a)"/><text x="600" y="425" font-size="12.5" fill="#2e7d4f" font-weight="600">OUT1–5 → GPIO 4, 16, 17, 18, 19</text><text x="600" y="440" font-size="12.5" fill="#2e7d4f" font-weight="600">OUT6 ignition → GPIO 34</text><text x="600" y="455" font-size="12.5" fill="#2e7d4f" font-weight="600">OUT7 reverse → GPIO 35</text>
<rect x="800" y="360" width="280" height="80" rx="10" fill="#dcecf2" stroke="#1c6b80" stroke-width="2"/><text x="812" y="384" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">ESP32 GPIO header</text><text x="812" y="404" font-size="12.5" fill="#5b6b75" text-anchor="start">12 V present → pin pulled LOW → "ON"</text><text x="812" y="421" font-size="12.5" fill="#5b6b75" text-anchor="start">GPIO 34/35 need a 10 k pull-up to 3V3</text>
<text x="40" y="530" font-size="16" fill="#1c6b80" font-weight="700" text-anchor="start">C. Relay outputs</text>
<rect x="40" y="545" width="330" height="180" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="52" y="569" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Small load (5 A or less)</text><text x="52" y="589" font-size="12.5" fill="#5b6b75" text-anchor="start">e.g. bed lights, LED strip</text><text x="52" y="606" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="52" y="623" font-size="12.5" fill="#5b6b75" text-anchor="start">fused 12 V → board relay COM</text><text x="52" y="640" font-size="12.5" fill="#5b6b75" text-anchor="start">board relay NO → load +</text><text x="52" y="657" font-size="12.5" fill="#5b6b75" text-anchor="start">load − → ground</text><text x="52" y="674" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="52" y="691" font-size="12.5" fill="#5b6b75" text-anchor="start">Never use NC: a failed relay must leave it off.</text>
<rect x="400" y="545" width="680" height="180" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/><text x="412" y="569" font-size="15" font-weight="700" fill="#1d2a33" text-anchor="start">Big load (compressor, inverter remote, fridge)</text><text x="412" y="589" font-size="12.5" fill="#5b6b75" text-anchor="start">the board relay only switches the COIL of a 40 A automotive relay:</text><text x="412" y="606" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="412" y="623" font-size="12.5" fill="#5b6b75" text-anchor="start">  coil:  2 A fuse → board COM → board NO → pin 86 → pin 85 → ground</text><text x="412" y="640" font-size="12.5" fill="#5b6b75" text-anchor="start">  load:  battery → fuse sized to the wire (often 30 A) → pin 30 → pin 87 → load</text><text x="412" y="657" font-size="12.5" fill="#5b6b75" text-anchor="start"></text><text x="412" y="674" font-size="12.5" fill="#5b6b75" text-anchor="start">Use a 40 A relay with a built-in diode (or add a 1N4007 across 85/86).</text><text x="412" y="691" font-size="12.5" fill="#5b6b75" text-anchor="start">Inverter: switch its remote-on wire, never its 100 A+ DC feed.</text>
</svg>