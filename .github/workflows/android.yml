# TA Companion, the Android helper app (android/). Built here because it needs the Android SDK.
# Every push that touches android/ builds the APK; on main it is also published as the
# "android-latest" release, so the tablet can always download the newest from one link.
name: android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk ta-companion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ta-companion-apk
          path: ta-companion.apk
      - name: Publish as android-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest ta-companion.apk --title "TA Companion (latest)" \
            --notes "The Android helper for the dash tablet, built from ${GITHUB_SHA::7}. Install: android/README.md." --latest=false
