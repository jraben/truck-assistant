; Slate Cockpit tier 1: the always-on watch (LilyGO T-SIM7080G-S3: ESP32-S3 + SIMCom SIM7080G + AXP2101).
; Build:  pio run          Flash: pio run -t upload       Logs: pio device monitor
; Copy include/secrets.example.h to include/secrets.h first (gitignored).

[platformio]
default_envs = t-sim7080g-s3

[env:t-sim7080g-s3]
; Pinned: espressif32 6.9.0 = Arduino-ESP32 2.0.17. Libraries pinned to exact versions.
platform = espressif32@6.9.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    vshymanskyy/TinyGSM@0.12.0
    lewisxhe/XPowersLib@0.2.6
