# /etc/systemd/system/slate-brain.service.d/10-release.conf  (updater/setup.sh puts it there)
# Run whichever release /opt/slate-cockpit-releases/current points at, so the
# updater can switch versions (and back) with one symlink.
[Service]
WorkingDirectory=/opt/slate-cockpit-releases/current
ExecStart=
ExecStart=/usr/bin/node --disable-warning=ExperimentalWarning /opt/slate-cockpit-releases/current/brain/dist/index.js
# The NAS backup share, when mounted there (deploy/pi/backup/setup-backup.sh); "-" = fine if absent.
ReadWritePaths=-/mnt/nas-backup
