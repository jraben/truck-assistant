# /etc/mosquitto/conf.d/slate.conf  (install.sh puts it there)
# Local broker for the truck: the ESP32 truck box and the brain both use it.

listener 1883 0.0.0.0
# The truck's own Wi-Fi AP only; add a password_file before exposing it anywhere else.
allow_anonymous true
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60
max_queued_messages 10000

# ---- Bridge to the home broker (Home Assistant) --------------------------------
# Comes up whenever the truck is on home Wi-Fi or Tailscale; offline, messages queue.
# Replace HOME_BROKER_HOST and the credentials, then restart mosquitto.
#
# connection home
# address HOME_BROKER_HOST:1883
# remote_clientid slate-truck
# remote_username CHANGE_ME
# remote_password CHANGE_ME
# cleansession false
# start_type automatic
# restart_timeout 10 60
# notifications true
# notification_topic slate/bridge/state
# queue_qos0_messages true
# try_private true
#
# # Everything the truck says goes home (truck box, brain state, trip/ended, charges).
# topic slate/# out 1
# # HA discovery for the Slate Truck device.
# topic homeassistant/sensor/slate/# out 1
# topic homeassistant/device_tracker/slate/# out 1
# # HA can switch the upfit relays.
# topic slate/truckbox/switch/+/command in 1
# # Optional: the wall charger's session energy, mirrored by HA's mqtt_statestream
# # (base_topic: homeassistant). Name the entity on the brain's settings page.
# topic homeassistant/sensor/+/state in 0
